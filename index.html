<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UTOPIA · 로그인</title>
  <meta name="theme-color" content="#006CC4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="is-loading login-page">
  <div class="login-bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <main class="login-wrap">
    <section class="login-card">
      <h1 class="login-title"><img class="login-logo" src="img/logo.svg" alt="UTOPIA"></h1>
      <p class="login-sub">이메일로 로그인해 주세요</p>

      <form id="loginForm" class="login-form" novalidate>
        <label class="field">
          <span class="field-label">이메일</span>
          <span class="input-wrap">
            <span data-icon="at"></span>
            <input id="email" type="email" name="email" autocomplete="username" inputmode="email" placeholder="you@example.com" required>
          </span>
        </label>

        <label class="field">
          <span class="field-label">비밀번호</span>
          <span class="input-wrap">
            <span data-icon="lock"></span>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="비밀번호" required>
            <button type="button" class="icon-btn sm pw-toggle" id="pwToggle" aria-label="비밀번호 보기"><span data-icon="eye"></span></button>
          </span>
        </label>

        <p class="form-error" id="loginError" role="alert" hidden></p>

        <button class="btn primary block lg" type="submit" id="loginBtn">
          <span class="btn-text">로그인</span>
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
